services:
  web:
    build: .
    hostname: THM-Chal
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${LAZYADMIN_BIND_ADDRESS:-127.0.0.1}:${LAZYADMIN_HTTP_PORT:-80}:80"
      - "${LAZYADMIN_BIND_ADDRESS:-127.0.0.1}:${LAZYADMIN_SSH_PORT:-22}:22"
    restart: unless-stopped

  db:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: local-lab-root-password
      MARIADB_DATABASE: sweetrice
      MARIADB_USER: rice
      MARIADB_PASSWORD: randompass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-lazyadmin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=localhost --user=root --password=$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
